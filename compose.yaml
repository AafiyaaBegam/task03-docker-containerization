services:
  app:
    build: .
    image: task03-docker-containerization-app:local
    container_name: task03-docker-containerization-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://task03:${POSTGRES_PASSWORD:-local_only_change_me}@db:5432/task03
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task03
      POSTGRES_USER: task03
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local_only_change_me}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task03 -d task03"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
networks:
  internal:
    driver: bridge
